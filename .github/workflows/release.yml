name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"  # 1.3.12 produces broken cross-compiled darwin binaries

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo build

      # semantic-release pipeline:
      #   commit-analyzer  → decide bump
      #   release-notes-generator + changelog
      #   @semantic-release/npm (npmPublish:false)  → bumps package.json to new version
      #   @semantic-release/exec.prepareCmd         → compiles Bun binaries for all 5 targets
      #                                              (see scripts/compile-release-binaries.sh)
      #   @semantic-release/github                  → creates the GitHub Release WITH
      #                                              the pre-built binaries attached, so the
      #                                              repo's immutable-releases policy is
      #                                              satisfied at creation time instead of
      #                                              failing on post-release uploads.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
