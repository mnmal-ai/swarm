name: AI Actions

on:
  pull_request:
    types: [opened, synchronize]
  issues:
    types: [opened]

# Cancel an in-flight pr-review on the same PR when a new commit lands.
# Issue-triggered runs key on the issue number so they don't trample
# PR-triggered runs and vice versa. Branch name is deliberately avoided
# as a key — it's on GitHub's untrusted-input list.
concurrency:
  group: ai-actions-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('issue-{0}', github.event.issue.number) }}
  cancel-in-progress: true

# The reusable workflows under mnmal-ai/.github declare
# `permissions: { contents: read, pull-requests: write, id-token: write }`
# on their jobs. Reusable-workflow job-level permissions OVERRIDE caller
# permissions, so the caller must grant at least the same set explicitly —
# otherwise job setup fails before any step runs (manifests as
# `startup_failure` with empty jobs[] and 1s duration). The
# top-level `permissions` block here is defense-in-depth so org-level
# "default GITHUB_TOKEN permissions" cannot strip them.
permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  pr-review:
    # Restrict to PR events AND skip draft PRs / PRs carrying `preview-no-build`.
    # The reusable workflow's claude-code-action consumes credits, so skipping
    # these costs is the highest-value gate in this file.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && !contains(github.event.pull_request.labels.*.name, 'preview-no-build')
    uses: mnmal-ai/.github/.github/workflows/pr-review.yml@main
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    secrets:
      # Both passed; the reusable workflow prefers OAuth when set
      # (CLAUDE_CODE_OAUTH_TOKEN bills against the Claude subscription
      # rather than per-credit ANTHROPIC_API_KEY). API key kept as a
      # fallback for the OAuth-cleared-mid-run upstream bug
      # (anthropics/claude-code-action#676).
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  issue-triage:
    if: github.event_name == 'issues'
    uses: mnmal-ai/.github/.github/workflows/issue-triage.yml@main
    permissions:
      contents: read
      issues: write
      id-token: write
    secrets:
      # As for pr-review: the reusable workflow prefers OAuth (the Claude
      # subscription) when set, with the API key as the fallback.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
